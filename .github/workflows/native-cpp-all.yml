name: Native C++ Build

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Branch, tag, or commit to build
        required: true
        type: string
        default: cpp_v0.8.2
  # build_cpp.yml and release_cpp.yml reuse this as the one definition of
  # "build the C++ game". An empty ref builds the caller's own commit.
  workflow_call:
    inputs:
      checkout_ref:
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives

jobs:
  windows:
    name: Windows / MSVC
    runs-on: windows-2025
    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout C++ source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up MSVC environment for Ninja
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up pinned Windows vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "fruity-vcpkg"
          git init $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $root remote add origin https://github.com/microsoft/vcpkg.git
          git -C $root fetch --depth 1 origin 07f4812200df3d3c931c0c8a6081d3b21fe2bf9f
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $root checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_INSTALLATION_ROOT=$root" >> $env:GITHUB_ENV
          "commit=$(git -C $root rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          $compiler = (Get-Command cl.exe -ErrorAction Stop).Source
          "compiler=$((Get-FileHash -LiteralPath $compiler -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT
          & "$root/vcpkg.exe" version

      # Separate archives by pinned ports, compiler and dependency recipe.
      - name: Cache vcpkg binary archives
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-vcpkg-windows-v2-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.compiler }}-${{ hashFiles('.github/workflows/native-cpp-all.yml') }}
          restore-keys: |
            native-vcpkg-windows-v2-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.compiler }}-
            native-vcpkg-all-${{ runner.os }}-${{ runner.arch }}-
            native-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare vcpkg binary cache directory
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Install native dependencies
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not set on the runner."
          }
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          if (-not (Test-Path $vcpkg)) {
            throw "vcpkg.exe was not found at $vcpkg"
          }
          & $vcpkg install curl:x64-windows libarchive:x64-windows zlib:x64-windows glfw3:x64-windows freetype:x64-windows openal-soft:x64-windows vulkan-loader:x64-windows vulkan-memory-allocator:x64-windows "skia[gl,freetype]:x64-windows" --clean-after-build 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/vcpkg-install.log"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # Save before the long game build so cancellation does not lose dependencies.
      - name: Save vcpkg binary archives after install
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-vcpkg-windows-v2-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.compiler }}-${{ hashFiles('.github/workflows/native-cpp-all.yml') }}

      - name: Upload dependency cache diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-cache-windows-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/vcpkg-install.log
            ${{ runner.temp }}/fruity-vcpkg/installed/x64-windows/share/*/vcpkg_abi_info.txt

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/native -G "Ninja Multi-Config" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DFRUITY_REQUIRE_VULKAN=ON `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build C++ FruityPrime
        shell: pwsh
        run: |
          cmake --build build/native --config RelWithDebInfo --parallel $env:NUMBER_OF_PROCESSORS --target fruity_prime
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Report compiler cache statistics
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FruityPrime-cpp-windows-${{ github.run_number }}
          if-no-files-found: error
          path: |
            build/native/RelWithDebInfo/FruityPrime.exe
            build/native/RelWithDebInfo/*.dll
            build/native/RelWithDebInfo/fruity-prime-logo.png
            build/native/RelWithDebInfo/fruity-prime-mark.png

  linux:
    name: Linux / GCC
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout C++ source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      # Pin ports/tools: runner updates must not silently change Skia's ABI.
      - name: Set up pinned vcpkg
        id: vcpkg
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/fruity-vcpkg"
          git init "$root"
          git -C "$root" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$root" fetch --depth 1 origin 07f4812200df3d3c931c0c8a6081d3b21fe2bf9f
          git -C "$root" checkout --detach FETCH_HEAD
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "commit=$(git -C "$root" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "compiler=$(sha256sum /usr/bin/g++ | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          "$root/vcpkg" version
          g++ --version

      # Reuse one archive per pinned dependency/toolchain set, rather than per run.
      - name: Cache vcpkg binary archives
        id: skia-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-skia-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.compiler }}
          restore-keys: |
            native-skia-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-
            native-vcpkg-all-${{ runner.os }}-${{ runner.arch }}-
            native-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare vcpkg binary cache directory
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libvulkan-dev \
            mesa-vulkan-drivers \
            vulkan-validationlayers \
            openbox \
            xvfb \
            xauth \
            cmake \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            libarchive-dev \
            libcurl4-openssl-dev \
            zlib1g-dev \
            libgl-dev \
            libglx-dev \
            libopengl-dev \
            libglfw3-dev \
            libfreetype-dev \
            libopenal-dev \
            libicu-dev

      - name: Install Skia Ganesh
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.vcpkg.outputs.root }}"
          "$root/vcpkg" install "skia[gl,freetype]:x64-linux" vulkan-memory-allocator:x64-linux --clean-after-build 2>&1 | tee "$RUNNER_TEMP/skia-install.log"
          echo "FRUITY_SKIA_PREFIX=$root/installed/x64-linux" >> "$GITHUB_ENV"

      - name: Save Skia cache immediately after install
        if: steps.skia-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-skia-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.compiler }}

      - name: Upload Skia cache diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skia-cache-linux-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/skia-install.log
            ${{ steps.vcpkg.outputs.root }}/installed/x64-linux/share/*/vcpkg_abi_info.txt

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-ccache-${{ runner.os }}-${{ runner.arch }}-gcc-game
          max-size: 1G

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="${FRUITY_SKIA_PREFIX}" -DFRUITY_REQUIRE_VULKAN=ON

      - name: Build C++ FruityPrime
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/native --config RelWithDebInfo --parallel "$(nproc)" --target fruity_prime

      - name: Vulkan foundation runtime gate
        shell: bash
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          set -euo pipefail
          xvfb-run -a build/native/FruityPrime -vulkancheck -noupdate 2>&1 | tee build/native/vulkan-foundation.log
          grep -F 'foundation PASS; clean shutdown; validation=1' build/native/vulkan-foundation.log

      - name: Vulkan resource runtime gate
        shell: bash
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          set -euo pipefail
          xvfb-run -a build/native/FruityPrime -vulkanresourcecheck -noupdate 2>&1 | tee build/native/vulkan-resources.log
          grep -F 'resources PASS; buffer upload/copy/readback; texture upload/readback/resize; transitions; live=0; validation=1; errors=0' build/native/vulkan-resources.log

      - name: Vulkan presentation runtime gate
        shell: bash
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          set -euo pipefail
          xvfb-run -a --server-args="-screen 0 1280x720x24" bash -lc '
            set -euo pipefail
            openbox --sm-disable > build/native/openbox.log 2>&1 &
            window_manager_pid=$!
            trap "kill $window_manager_pid 2>/dev/null || true" EXIT
            sleep 1
            build/native/FruityPrime -vulkanpresentcheck -noupdate 2>&1 | tee build/native/vulkan-presentation.log
            build/native/FruityPrime -vulkanpresentfallbackcheck -noupdate 2>&1 | tee build/native/vulkan-presentation-fallback.log
          '
          grep -F 'presentation PASS; clear present; resize; fullscreen; minimize/restore; clean shutdown; validation=1; errors=0' build/native/vulkan-presentation.log
          grep -F 'presentation PASS; clear present; resize; fullscreen; minimize/restore; clean shutdown; validation=1; errors=0' build/native/vulkan-presentation-fallback.log
          grep -E 'fallback-retired-releases=[1-9][0-9]*' build/native/vulkan-presentation-fallback.log

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: FruityPrime-cpp-linux-${{ github.run_number }}
          if-no-files-found: error
          path: |
            build/native/FruityPrime
            build/native/fruity-prime-logo.png
            build/native/fruity-prime-mark.png

  macos:
    name: macOS / Clang
    runs-on: macos-15

    steps:
      - name: Checkout C++ source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      # Shares archives with the per-platform native workflows: Skia is
      # rebuilt only when its vcpkg ABI hash changes.
      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-vcpkg-all-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            native-vcpkg-all-${{ runner.os }}-${{ runner.arch }}-
            native-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare vcpkg binary cache directory
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install autoconf autoconf-archive automake libtool curl libarchive zlib glfw freetype openal-soft
          echo "CMAKE_PREFIX_PATH=$(brew --prefix curl);$(brew --prefix libarchive);$(brew --prefix zlib);$(brew --prefix glfw);$(brew --prefix freetype);$(brew --prefix openal-soft)" >> "$GITHUB_ENV"

      - name: Install Skia Ganesh
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${VCPKG_INSTALLATION_ROOT:-}" && -x "${VCPKG_INSTALLATION_ROOT}/vcpkg" ]]; then
            root="${VCPKG_INSTALLATION_ROOT}"
          else
            root="${RUNNER_TEMP}/vcpkg"
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$root"
            "$root/bootstrap-vcpkg.sh" -disableMetrics
          fi
          if [[ "$(uname -m)" == "arm64" ]]; then
            triplet="arm64-osx"
          else
            triplet="x64-osx"
          fi
          "$root/vcpkg" install "skia[gl,freetype]:$triplet" --clean-after-build
          echo "FRUITY_SKIA_PREFIX=$root/installed/$triplet" >> "$GITHUB_ENV"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-ccache-${{ runner.os }}-${{ runner.arch }}-clang-game
          max-size: 1G

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="${FRUITY_SKIA_PREFIX};$CMAKE_PREFIX_PATH"

      - name: Build C++ FruityPrime
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/native --config RelWithDebInfo --parallel "$(sysctl -n hw.ncpu)" --target fruity_prime

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: FruityPrime-cpp-macos-${{ github.run_number }}
          if-no-files-found: error
          path: |
            build/native/FruityPrime
            build/native/fruity-prime-logo.png
            build/native/fruity-prime-mark.png
