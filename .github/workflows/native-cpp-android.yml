name: Native C++ Android

on:
  push:
    branches: [develop2]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/MphRead.Native.Android/**"
      - "src/MphRead.Native/**"
      - "src/NcsfPlay.Native/**"
      - "src/MphRead.Android/MphRead.Android.csproj"
      - ".github/workflows/native-cpp-android.yml"
  pull_request:
    branches: [develop2]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/MphRead.Native.Android/**"
      - "src/MphRead.Native/**"
      - "src/NcsfPlay.Native/**"
      - "src/MphRead.Android/MphRead.Android.csproj"
      - ".github/workflows/native-cpp-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-native:
    name: Android NDK native libraries
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load repository Android build contract
        shell: bash
        run: |
          set -euo pipefail
          cmake -DOUTPUT_FILE="$GITHUB_ENV" -P cmake/ExportAndroidConfig.cmake

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: "false"

      - name: Install pinned Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          ndk_home="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          test -f "${ndk_home}/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=${ndk_home}" >> "$GITHUB_ENV"

      - name: Install shared-source header dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-dev libcurl4-openssl-dev

          include_root="$GITHUB_WORKSPACE/.native-deps/include"
          mkdir -p "$include_root"

          archive_h="$(dpkg -L libarchive-dev | awk '/\/archive\.h$/ { print; exit }')"
          archive_entry_h="$(dpkg -L libarchive-dev | awk '/\/archive_entry\.h$/ { print; exit }')"
          curl_h="$(dpkg -L libcurl4-openssl-dev | awk '/\/curl\/curl\.h$/ { print; exit }')"
          test -f "$archive_h"
          test -f "$archive_entry_h"
          test -f "$curl_h"

          cp "$archive_h" "$include_root/archive.h"
          cp "$archive_entry_h" "$include_root/archive_entry.h"
          cp -a "$(dirname "$curl_h")" "$include_root/curl"
          echo "FRUITY_NATIVE_DEPENDENCY_INCLUDE_DIR=${include_root}" >> "$GITHUB_ENV"

      - name: Verify pinned NDK toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "${toolchain}/clang++"
          "${toolchain}/clang++" --version
          printf 'compile SDK: android-%s\n' "$ANDROID_COMPILE_SDK"
          printf 'minimum API: %s\n' "$ANDROID_MIN_API"
          printf 'NDK: %s\n' "$ANDROID_NDK_VERSION"
          printf 'ABIs: %s\n' "$FRUITY_ANDROID_ABIS"

      - name: Configure and build every repository ABI
        shell: bash
        run: |
          set -euo pipefail

          for abi in $FRUITY_ANDROID_ABIS; do
            build_dir="build/native-android-${abi}"
            cmake -S . -B "$build_dir" \
              -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" \
              -DANDROID_PLATFORM="android-${ANDROID_MIN_API}" \
              -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DFRUITY_NATIVE_DEPENDENCY_INCLUDE_DIR="$FRUITY_NATIVE_DEPENDENCY_INCLUDE_DIR"

            cmake --build "$build_dir" \
              --config RelWithDebInfo \
              --parallel 2 \
              --target fruity_mphread_native_android
          done
