name: Native C++ Desktop

on:
  push:
    branches: [develop2]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/MphRead.Native/**"
      - "src/NcsfPlay.Native/**"
      - ".github/workflows/native-cpp-desktop.yml"
  pull_request:
    branches: [develop2]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/MphRead.Native/**"
      - "src/NcsfPlay.Native/**"
      - ".github/workflows/native-cpp-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-native:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: Windows / MSVC
            toolchain: msvc
          - os: macos-15
            label: macOS / Clang
            toolchain: clang
          - os: ubuntu-24.04
            label: Linux / GCC
            toolchain: gcc

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify MSVC toolchain
        if: matrix.toolchain == 'msvc'
        shell: pwsh
        run: |
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found." }
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "MSVC x86/x64 C++ tools were not found." }
          Write-Host "MSVC installation: $installation"

      - name: Verify Clang toolchain
        if: matrix.toolchain == 'clang'
        shell: bash
        run: |
          set -euo pipefail
          clang++ --version
          cmake --version

      - name: Verify GCC toolchain
        if: matrix.toolchain == 'gcc'
        shell: bash
        run: |
          set -euo pipefail
          g++ --version
          cmake --version

      - name: Install native dependencies on Windows
        if: matrix.toolchain == 'msvc'
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) { throw "VCPKG_INSTALLATION_ROOT is not set on the runner." }
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          if (-not (Test-Path $vcpkg)) { throw "vcpkg.exe was not found at $vcpkg" }
          & $vcpkg install curl:x64-windows libarchive:x64-windows zlib:x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install native dependencies on macOS
        if: matrix.toolchain == 'clang'
        shell: bash
        run: |
          set -euo pipefail
          brew install curl libarchive zlib
          echo "CMAKE_PREFIX_PATH=$(brew --prefix curl);$(brew --prefix libarchive);$(brew --prefix zlib)" >> "$GITHUB_ENV"

      - name: Install native dependencies on Linux
        if: matrix.toolchain == 'gcc'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-dev libcurl4-openssl-dev zlib1g-dev

      - name: Configure with MSVC
        if: matrix.toolchain == 'msvc'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/native | Out-Null
          cmake -S . -B build/native -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:CMAKE_TOOLCHAIN_FILE" `
            -DVCPKG_TARGET_TRIPLET=x64-windows 2>&1 | Tee-Object -FilePath build/native/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure with Unix toolchain
        if: matrix.toolchain != 'msvc'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native
          cmake -S . -B build/native \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}" 2>&1 | tee build/native/configure.log

      - name: Build shared native owners
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/native \
            --config RelWithDebInfo \
            --parallel 2 \
            --verbose \
            --target fruity_ncsfplay_native fruity_mphread_native 2>&1 | tee build/native/build.log

      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cpp-${{ matrix.toolchain }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/native/CMakeCache.txt
            build/native/CMakeFiles/CMakeConfigureLog.yaml
            build/native/configure.log
            build/native/build.log
            build/native/**/*.a
            build/native/**/*.lib
