name: Native C++ Windows / MSVC

on:
  push:
    branches: [develop2]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/MphRead.Native/**"
      - "src/NcsfPlay.Native/**"
      - ".github/workflows/native-cpp-windows.yml"
  pull_request:
    branches: [develop2]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/MphRead.Native/**"
      - "src/NcsfPlay.Native/**"
      - ".github/workflows/native-cpp-windows.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives

jobs:
  windows-native:
    name: Windows / MSVC
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-msvc-x64-windows-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.github/workflows/native-cpp-windows.yml') }}
          restore-keys: |
            native-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-msvc-x64-windows-

      - name: Report vcpkg cache result
        shell: pwsh
        env:
          CACHE_HIT: ${{ steps.vcpkg-cache.outputs.cache-hit }}
        run: Write-Host "vcpkg binary cache exact hit: $env:CACHE_HIT"

      - name: Verify MSVC toolchain
        shell: pwsh
        run: |
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found." }
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "MSVC x86/x64 C++ tools were not found." }
          Write-Host "MSVC installation: $installation"

      - name: Install native dependencies on Windows
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) { throw "VCPKG_INSTALLATION_ROOT is not set on the runner." }
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          if (-not (Test-Path $vcpkg)) { throw "vcpkg.exe was not found at $vcpkg" }
          & $vcpkg install curl:x64-windows libarchive:x64-windows zlib:x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure with MSVC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/native | Out-Null
          cmake -S . -B build/native -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:CMAKE_TOOLCHAIN_FILE" `
            -DVCPKG_TARGET_TRIPLET=x64-windows 2>&1 | Tee-Object -FilePath build/native/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build shared native owners
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/native \
            --config RelWithDebInfo \
            --parallel 2 \
            --verbose \
            --target fruity_ncsfplay_native fruity_mphread_native 2>&1 | tee build/native/build.log

      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cpp-msvc-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/native/CMakeCache.txt
            build/native/CMakeFiles/CMakeConfigureLog.yaml
            build/native/configure.log
            build/native/build.log
            build/native/**/*.a
            build/native/**/*.lib
